<!DOCTYPE html>
<html lang="ru" data-theme="vice">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAINK — AI Car Scanner v4.0</title>
<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
window.transformersReady = pipeline;
env.allowLocalModels = false;
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--a:#ff2e88;--b:#ff7a18;--c:#00e5ff;--bg:#07030f;--ink:#f4eeff;--muted:#9d8fc0;--line:rgba(190,140,255,.18);--good:#3ef08c;--bad:#ff3b5c;--grad:linear-gradient(100deg,var(--a),var(--b))}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:20px}
h1{font-size:32px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.status{font-family:monospace;font-size:12px;color:var(--c);padding:10px 16px;background:rgba(0,229,255,.08);border:1px solid var(--line);border-radius:10px;max-width:90%;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center}
.status.err{color:var(--bad);border-color:rgba(255,59,92,.3);background:rgba(255,59,92,.08)}
.status.ok{color:var(--good);border-color:rgba(62,240,140,.3);background:rgba(62,240,140,.08)}
video{width:min(90vw,480px);aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:2px solid var(--line);background:#000}
video.hidden{display:none}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font-family:inherit;padding:12px 20px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid var(--line);color:var(--ink);background:rgba(190,140,255,.06);transition:.2s}
button:hover:not(:disabled){border-color:var(--c);box-shadow:0 0 14px -4px var(--c)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--grad);color:#14061f;border:0}
button.primary:hover:not(:disabled){box-shadow:0 10px 30px -6px var(--a)}
.result{width:min(90vw,480px);background:rgba(22,11,44,.78);border:1px solid var(--line);border-radius:16px;padding:16px;display:none}
.result.show{display:block}
.result h3{font-size:14px;color:var(--c);font-family:monospace;letter-spacing:.2em;margin-bottom:10px;text-transform:uppercase}
.pred{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(10,5,22,.5);border-radius:8px;margin-bottom:6px;font-size:13px}
.pred .name{flex:1;font-weight:600}
.pred .conf{font-family:monospace;color:var(--good);font-weight:700}
.pred.top{background:rgba(62,240,140,.1);border:1px solid rgba(62,240,140,.3)}
.match{margin-top:12px;padding:12px;border-radius:10px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.3)}
.match b{color:var(--c);display:block;font-size:15px;margin-bottom:4px}
.match small{color:var(--muted);font-size:11px}
.progress{width:min(90vw,480px);height:4px;background:rgba(190,140,255,.15);border-radius:2px;overflow:hidden;display:none}
.progress.show{display:block}
.progress i{display:block;height:100%;background:var(--grad);width:0%;transition:width .3s}
.info{font-size:11px;color:var(--muted);max-width:480px;text-align:center;line-height:1.5}
</style>
</head>
<body>

<h1>WAINK · AI v4.0</h1>
<div class="status" id="status">Инициализация...</div>
<div class="progress" id="progress"><i id="progressBar"></i></div>
<video id="video" playsinline muted autoplay class="hidden"></video>
<div class="controls">
  <button id="btnCam" class="primary" disabled>📷 Включить камеру</button>
  <button id="btnScan" disabled>🔍 Сканировать</button>
</div>
<div class="result" id="result">
  <h3>Результаты AI</h3>
  <div id="predictions"></div>
  <div class="match" id="match" style="display:none"></div>
</div>
<div class="info">
  Используется модель <b>ViT (Vision Transformer)</b> от Hugging Face, оптимизированная для распознавания автомобилей. Первая загрузка модели ~90 МБ.
</div>

<script type="module">
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progress');
const progressBar = document.getElementById('progressBar');
const video = document.getElementById('video');
const btnCam = document.getElementById('btnCam');
const btnScan = document.getElementById('btnScan');
const resultEl = document.getElementById('result');
const predictionsEl = document.getElementById('predictions');
const matchEl = document.getElementById('match');

// База автомобилей
const DB = [
  {id:'camry', make:'Toyota', model:'Camry', keywords:['camry','toyota car','toyota']},
  {id:'corolla', make:'Toyota', model:'Corolla', keywords:['corolla','toyota']},
  {id:'civic', make:'Honda', model:'Civic', keywords:['civic','honda']},
  {id:'accord', make:'Honda', model:'Accord', keywords:['accord','honda']},
  {id:'m3', make:'BMW', model:'M3 / M4', keywords:['bmw m','bmw','m3','m4']},
  {id:'eclas', make:'Mercedes-Benz', model:'E-Class', keywords:['mercedes','e-class','mercedes-benz']},
  {id:'911', make:'Porsche', model:'911', keywords:['911','porsche']},
  {id:'mustang', make:'Ford', model:'Mustang', keywords:['mustang','ford']},
  {id:'gtr', make:'Nissan', model:'GT-R', keywords:['gt-r','nissan','gtr']},
  {id:'corvette', make:'Chevrolet', model:'Corvette', keywords:['corvette','chevrolet','chevy']},
  {id:'rs6', make:'Audi', model:'RS6 Avant', keywords:['rs6','audi rs','audi']},
  {id:'huracan', make:'Lamborghini', model:'Huracán', keywords:['huracan','lamborghini','lambo']},
  {id:'ferrari', make:'Ferrari', model:'Ferrari', keywords:['ferrari']},
  {id:'model3', make:'Tesla', model:'Model 3', keywords:['tesla','model 3']},
  {id:'lc300', make:'Toyota', model:'Land Cruiser', keywords:['land cruiser','cruiser','toyota suv']},
  {id:'golf', make:'Volkswagen', model:'Golf', keywords:['golf','volkswagen','vw']},
  {id:'wrx', make:'Subaru', model:'WRX', keywords:['wrx','subaru']},
  {id:'challenger', make:'Dodge', model:'Challenger', keywords:['challenger','dodge']},
  {id:'rangerover', make:'Land Rover', model:'Range Rover', keywords:['range rover','land rover','rover']},
  {id:'solaris', make:'Hyundai', model:'Solaris / Accent', keywords:['solaris','accent','hyundai']},
  {id:'k5', make:'Kia', model:'K5 / Optima', keywords:['k5','optima','kia']},
  {id:'mazda3', make:'Mazda', model:'Mazda3', keywords:['mazda3','mazda 3','mazda']},
  {id:'modely', make:'Tesla', model:'Model Y', keywords:['model y','tesla suv']},
  {id:'f150', make:'Ford', model:'F-150', keywords:['f-150','f150','ford truck','pickup']},
  {id:'raptor', make:'Ford', model:'Raptor', keywords:['raptor','ford raptor']}
];

let classifier = null;
let stream = null;

// Загрузка модели
async function loadModel() {
  try {
    statusEl.textContent = 'Загрузка модели ViT для авто...';
    statusEl.className = 'status';
    progressEl.classList.add('show');
    
    // Используем модель, оптимизированную для авто-классов ImageNet
    // ViT лучше MobileNet различает марки автомобилей
    const pipe = await window.transformersReady('image-classification', 'Xenova/vit-base-patch16-224', {
      progress_callback: (progress) => {
        if (progress.progress) {
          progressBar.style.width = progress.progress.toFixed(0) + '%';
          statusEl.textContent = `Загрузка: ${progress.progress.toFixed(0)}% (${(progress.loaded/1024/1024).toFixed(1)} МБ)`;
        }
      }
    });
    
    classifier = pipe;
    statusEl.textContent = '✓ Модель готова! Включите камеру.';
    statusEl.className = 'status ok';
    progressEl.classList.remove('show');
    btnCam.disabled = false;
  } catch (e) {
    statusEl.textContent = '✗ Ошибка загрузки: ' + e.message;
    statusEl.className = 'status err';
    console.error(e);
  }
}

// Включение камеры
btnCam.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    video.classList.remove('hidden');
    btnScan.disabled = false;
    btnCam.disabled = true;
    statusEl.textContent = '📷 Камера активна. Наведите на авто и нажмите Сканировать.';
  } catch (e) {
    statusEl.textContent = '✗ Ошибка камеры: ' + e.message;
    statusEl.className = 'status err';
  }
});

// Сопоставление результатов с базой
function matchWithDatabase(predictions) {
  const scores = {};
  
  for (const pred of predictions) {
    const label = pred.label.toLowerCase();
    
    for (const car of DB) {
      for (const kw of car.keywords) {
        if (label.includes(kw.toLowerCase())) {
          if (!scores[car.id]) scores[car.id] = { car, score: 0, matchedLabels: [] };
          scores[car.id].score += pred.score;
          scores[car.id].matchedLabels.push(`${pred.label} (${(pred.score*100).toFixed(1)}%)`);
        }
      }
    }
  }
  
  // Сортируем по сумме совпадений
  const matches = Object.values(scores).sort((a, b) => b.score - a.score);
  return matches;
}

// Сканирование
btnScan.addEventListener('click', async () => {
  if (!classifier) return;
  
  btnScan.disabled = true;
  statusEl.textContent = '🧠 AI анализирует изображение...';
  statusEl.className = 'status';
  
  try {
    // Небольшая задержка для стабильности кадра
    await new Promise(r => setTimeout(r, 300));
    
    const predictions = await classifier(video, { topk: 10 });
    
    console.log('Raw predictions:', predictions);
    
    // Показываем сырые результаты
    predictionsEl.innerHTML = predictions.map((p, i) => 
      `<div class="pred ${i===0?'top':''}">
        <span class="name">${p.label}</span>
        <span class="conf">${(p.score*100).toFixed(1)}%</span>
      </div>`
    ).join('');
    
    // Сопоставляем с базой
    const matches = matchWithDatabase(predictions);
    
    if (matches.length > 0) {
      const best = matches[0];
      matchEl.style.display = 'block';
      matchEl.innerHTML = `
        <b>🚗 ${best.car.make} ${best.car.model}</b>
        <small>Совпадений: ${best.matchedLabels.length} · Уверенность: ${(best.score*100).toFixed(1)}%</small>
        <div style="margin-top:8px;font-size:10px;color:var(--muted);font-family:monospace">
          ${best.matchedLabels.slice(0, 3).join('<br>')}
        </div>
      `;
      statusEl.textContent = `✓ Распознано: ${best.car.make} ${best.car.model}`;
      statusEl.className = 'status ok';
    } else {
      matchEl.style.display = 'block';
      matchEl.innerHTML = `
        <b>⚠ Автомобиль не найден в базе</b>
        <small>AI видит: ${predictions[0].label}, но такой модели нет в нашей базе. Попробуйте другую машину.</small>
      `;
      statusEl.textContent = 'Автомобиль не распознан (нет в базе)';
      statusEl.className = 'status';
    }
    
    resultEl.classList.add('show');
  } catch (e) {
    statusEl.textContent = '✗ Ошибка анализа: ' + e.message;
    statusEl.className = 'status err';
    console.error(e);
  } finally {
    btnScan.disabled = false;
  }
});

// Запуск
loadModel();
</script>
</body>
</html>
