<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAINK · AI Car Scanner v4.0 (ViT)</title>
<!-- UMD сборка Transformers.js - работает локально без module/HTTPS -->
<script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --a:#ff2e88;--b:#ff7a18;--c:#00e5ff;--d:#8b3dff;
  --bg0:#07030f;--bg1:#120826;--bg2:#1a0d33;
  --surface:rgba(22,11,44,.78);--surface2:rgba(30,15,58,.92);
  --ink:#f4eeff;--muted:#9d8fc0;--line:rgba(190,140,255,.18);
  --good:#3ef08c;--warn:#ffb020;--bad:#ff3b5c;--info:#38bdf8;--gold:#ffd60a;
  --grad:linear-gradient(100deg,var(--a),var(--b));
  --grad3:linear-gradient(115deg,var(--a),var(--b) 45%,var(--c));
}
html,body{height:100%;background:var(--bg0);color:var(--ink);font-family:'JetBrains Mono',monospace;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:20px;gap:20px;background:radial-gradient(120% 90% at 50% 110%,#241040 0%,var(--bg0) 60%)}

.app{position:relative;width:min(95vw,420px);aspect-ratio:9/19;border-radius:48px;background:#05020a;border:1px solid rgba(190,140,255,.25);box-shadow:0 0 0 1px rgba(0,0,0,.8),0 30px 90px -20px rgba(139,61,255,.5),0 0 90px -20px rgba(255,46,136,.35),inset 0 0 24px rgba(139,61,255,.15);overflow:hidden}
.app-inner{position:absolute;inset:10px;border-radius:40px;overflow:hidden;background:var(--bg0);display:flex;flex-direction:column}

.header{padding:16px 18px;display:flex;align-items:center;gap:10px;z-index:10}
.logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:18px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,46,136,.5))}
.logo small{display:block;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.3em;color:var(--muted);margin-top:2px;-webkit-text-fill-color:var(--muted)}

.status-bar{margin:0 18px 10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:10px;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:38px}
.status-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);box-shadow:0 0 6px currentColor;flex:none}
.status-bar.loading .dot{background:var(--warn);animation:blink 1s infinite}
.status-bar.ready .dot{background:var(--good)}
.status-bar.error .dot{background:var(--bad)}
.status-bar.scanning .dot{background:var(--c);animation:blink .4s infinite}
.status-bar.success .dot{background:var(--good)}
@keyframes blink{50%{opacity:.3}}

.progress-wrap{margin:0 18px 10px;height:3px;background:rgba(190,140,255,.15);border-radius:2px;overflow:hidden;display:none}
.progress-wrap.show{display:block}
.progress-bar{height:100%;background:var(--grad);width:0%;transition:width .3s;box-shadow:0 0 8px var(--a)}

.video-wrap{flex:1;margin:0 18px;position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#000;min-height:200px}
video{width:100%;height:100%;object-fit:cover;display:block}
video.hidden{display:none}
.video-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:11px;text-align:center;padding:20px}
.video-placeholder.hidden{display:none}
.video-placeholder svg{width:48px;height:48px;stroke:var(--muted);stroke-width:1.2;fill:none;opacity:.5}

.controls{display:flex;gap:10px;padding:12px 18px;justify-content:center;flex-wrap:wrap}
.btn{font-family:inherit;padding:10px 16px;border-radius:12px;font-weight:700;font-size:11px;letter-spacing:.08em;cursor:pointer;border:1px solid var(--line);color:var(--ink);background:var(--surface);transition:.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-transform:uppercase}
.btn:hover:not(:disabled){border-color:var(--c);box-shadow:0 0 14px -4px var(--c)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--grad);color:#14061f;border:0;box-shadow:0 8px 24px -8px var(--a)}
.btn.primary:hover:not(:disabled){box-shadow:0 10px 30px -6px var(--a);transform:translateY(-1px)}

.results{max-height:38vh;overflow-y:auto;margin:0 18px 12px;display:none;flex-direction:column;gap:8px;padding-right:4px}
.results.show{display:flex}
.results::-webkit-scrollbar{width:4px}
.results::-webkit-scrollbar-thumb{background:var(--grad);border-radius:2px}

.result-header{font-size:9px;letter-spacing:.3em;color:var(--c);text-transform:uppercase;padding:4px 0 2px;border-bottom:1px solid var(--line);margin-bottom:4px}

.pred{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:.2s;cursor:pointer}
.pred:hover{border-color:var(--c);background:rgba(190,140,255,.08)}
.pred.top{border-color:var(--good);background:rgba(62,240,140,.06)}
.pred-icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-weight:900;font-size:13px;color:var(--ink);flex:none;background:var(--bg1);border:1px solid var(--line)}
.pred-info{flex:1;min-width:0}
.pred-name{font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pred-sub{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.05em}
.pred-conf{font-family:inherit;font-size:11px;font-weight:700;color:var(--good);flex:none}

.match{padding:12px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.3);border-radius:12px;display:none}
.match.show{display:block}
.match b{font-family:'Unbounded',sans-serif;font-size:15px;color:var(--c);display:block;margin-bottom:6px;background:var(--grad3);-webkit-background-clip:text;background-clip:text}
.match small{font-size:9px;color:var(--muted);line-height:1.5;display:block;letter-spacing:.05em}
.match .reasons{margin-top:8px;font-size:9px;color:var(--muted);padding:8px;background:rgba(10,5,22,.5);border-radius:8px;border:1px solid var(--line)}

.info{margin:0 18px 16px;font-size:9px;color:var(--muted);text-align:center;line-height:1.5;letter-spacing:.03em}
.info b{color:var(--c)}

.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.3;mix-blend-mode:screen;pointer-events:none;z-index:-1}
.blob.b1{width:50vw;height:50vw;left:-15vw;top:-20vw;background:radial-gradient(circle,var(--a),transparent 65%)}
.blob.b2{width:45vw;height:45vw;right:-10vw;bottom:-10vw;background:radial-gradient(circle,var(--d),transparent 65%)}

@media(max-width:480px){
  body{padding:0;gap:0}
  .app{width:100vw;aspect-ratio:auto;height:100vh;height:100dvh;border-radius:0;border:0;box-shadow:none}
  .app-inner{border-radius:0;inset:0}
}
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="app">
  <div class="app-inner">
    <div class="header">
      <div class="logo">WAINK<small>AI · SCAN · v4.0</small></div>
    </div>

    <div class="status-bar loading" id="status">
      <span class="dot"></span>
      <span id="statusText">Загрузка AI-модели ViT...</span>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="video-wrap">
      <video id="video" playsinline muted autoplay class="hidden"></video>
      <div class="video-placeholder" id="placeholder">
        <svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="13" rx="3"/><circle cx="12" cy="13" r="3.6"/><path d="M8.5 6.5 10 4h4l1.5 2.5"/></svg>
        <div>AI-модель ViT<br>загружается (~90 МБ)</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="btnCam" disabled>📷 Камера</button>
      <button class="btn" id="btnScan" disabled>🔍 Скан</button>
    </div>

    <div class="results" id="results"></div>

    <div class="match" id="match"></div>

    <div class="info">
      Модель <b>ViT (Vision Transformer)</b> от Hugging Face.<br>
      Работает в браузере через Transformers.js · без сервера.
    </div>
  </div>
</div>

<script>
// База автомобилей
const DB = [
  {id:'camry', make:'Toyota', model:'Camry', keywords:['camry','toyota']},
  {id:'corolla', make:'Toyota', model:'Corolla', keywords:['corolla','toyota']},
  {id:'civic', make:'Honda', model:'Civic', keywords:['civic','honda']},
  {id:'accord', make:'Honda', model:'Accord', keywords:['accord','honda']},
  {id:'m4', make:'BMW', model:'M3 / M4', keywords:['m3','m4','bmw m','bmw']},
  {id:'eclas', make:'Mercedes-Benz', model:'E-Class', keywords:['mercedes','e-class','mercedes-benz']},
  {id:'911', make:'Porsche', model:'911', keywords:['911','porsche']},
  {id:'mustang', make:'Ford', model:'Mustang', keywords:['mustang','ford']},
  {id:'gtr', make:'Nissan', model:'GT-R', keywords:['gt-r','nissan','gtr']},
  {id:'corvette', make:'Chevrolet', model:'Corvette', keywords:['corvette','chevrolet','chevy']},
  {id:'rs6', make:'Audi', model:'RS6 Avant', keywords:['rs6','audi rs','audi']},
  {id:'huracan', make:'Lamborghini', model:'Huracán', keywords:['huracan','lamborghini','lambo']},
  {id:'ferrari', make:'Ferrari', model:'Ferrari', keywords:['ferrari']},
  {id:'model3', make:'Tesla', model:'Model 3', keywords:['tesla','model 3']},
  {id:'lc300', make:'Toyota', model:'Land Cruiser', keywords:['land cruiser','cruiser','toyota']},
  {id:'golf', make:'Volkswagen', model:'Golf', keywords:['golf','volkswagen','vw']},
  {id:'wrx', make:'Subaru', model:'WRX', keywords:['wrx','subaru']},
  {id:'challenger', make:'Dodge', model:'Challenger', keywords:['challenger','dodge']},
  {id:'rangerover', make:'Land Rover', model:'Range Rover', keywords:['range rover','land rover','rover']},
  {id:'solaris', make:'Hyundai', model:'Solaris / Accent', keywords:['solaris','accent','hyundai']},
  {id:'k5', make:'Kia', model:'K5 / Optima', keywords:['k5','optima','kia']},
  {id:'mazda3', make:'Mazda', model:'Mazda3', keywords:['mazda3','mazda']},
  {id:'modely', make:'Tesla', model:'Model Y', keywords:['model y','tesla']},
  {id:'f150', make:'Ford', model:'F-150', keywords:['f-150','f150','ford']},
  {id:'raptor', make:'Ford', model:'Raptor', keywords:['raptor','ford raptor']},
  {id:'miata', make:'Mazda', model:'MX-5 Miata', keywords:['miata','mx-5','mazda']},
  {id:'beetle', make:'Volkswagen', model:'Beetle', keywords:['beetle','volkswagen','vw']},
  {id:'limo', make:'Lincoln', model:'Limousine', keywords:['limousine','limo','lincoln']},
  {id:'cab', make:'Checker', model:'Taxi Cab', keywords:['taxi','cab','checker']},
  {id:'jeep', make:'Jeep', model:'Wrangler', keywords:['jeep','wrangler']}
];

// Элементы
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const video = document.getElementById('video');
const placeholder = document.getElementById('placeholder');
const btnCam = document.getElementById('btnCam');
const btnScan = document.getElementById('btnScan');
const resultsEl = document.getElementById('results');
const matchEl = document.getElementById('match');

let classifier = null;
let stream = null;

// Функция для установки статуса
function setStatus(text, state) {
  statusText.textContent = text;
  statusEl.className = 'status-bar ' + (state || '');
}

// Загрузка модели ViT
async function loadModel() {
  try {
    if (typeof window.Transformers === 'undefined') {
      throw new Error('Transformers.js не загружен. Проверьте интернет.');
    }
    
    setStatus('Инициализация Transformers.js...', 'loading');
    progressWrap.classList.add('show');
    
    const { pipeline } = window.Transformers;
    
    // ViT - Vision Transformer, обучен на ImageNet
    // Лучше MobileNet различает автомобили (90 МБ)
    classifier = await pipeline('image-classification', 'Xenova/vit-base-patch16-224', {
      progress_callback: (progress) => {
        if (progress.status === 'progress' && progress.progress) {
          progressBar.style.width = progress.progress.toFixed(0) + '%';
          setStatus(`Загрузка модели: ${progress.progress.toFixed(0)}%`, 'loading');
        } else if (progress.status === 'done') {
          setStatus(`Файл загружен: ${progress.file || 'готов'}`, 'loading');
        } else if (progress.status === 'initiate') {
          setStatus(`Загружаем: ${progress.file || 'модель'}...`, 'loading');
        }
      }
    });
    
    progressWrap.classList.remove('show');
    setStatus('✓ Модель ViT готова. Включите камеру.', 'ready');
    btnCam.disabled = false;
    placeholder.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="13" rx="3"/><circle cx="12" cy="13" r="3.6"/><path d="M8.5 6.5 10 4h4l1.5 2.5"/></svg><div>Нажмите "📷 Камера"</div>';
  } catch (e) {
    setStatus('✗ Ошибка: ' + e.message, 'error');
    console.error('Load error:', e);
    progressWrap.classList.remove('show');
  }
}

// Включение камеры
btnCam.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    video.classList.remove('hidden');
    placeholder.classList.add('hidden');
    btnScan.disabled = false;
    btnCam.disabled = true;
    btnCam.textContent = '✓ Камера';
    setStatus('📷 Камера активна. Наведите на авто и нажмите "Скан".', 'ready');
  } catch (e) {
    setStatus('✗ Камера: ' + (e.message || 'доступ запрещён'), 'error');
  }
});

// Сопоставление AI результата с базой
function matchWithDatabase(predictions) {
  const scores = {};
  
  for (const pred of predictions) {
    const label = pred.label.toLowerCase();
    
    for (const car of DB) {
      for (const kw of car.keywords) {
        if (label.includes(kw.toLowerCase())) {
          if (!scores[car.id]) {
            scores[car.id] = { car, score: 0, matchedLabels: [] };
          }
          scores[car.id].score += pred.score;
          scores[car.id].matchedLabels.push({
            label: pred.label,
            score: pred.score
          });
        }
      }
    }
  }
  
  return Object.values(scores).sort((a, b) => b.score - a.score);
}

// Сканирование
btnScan.addEventListener('click', async () => {
  if (!classifier) return;
  
  btnScan.disabled = true;
  setStatus('🧠 AI анализирует кадр (2-5 сек)...', 'scanning');
  matchEl.classList.remove('show');
  
  try {
    // Небольшая задержка для стабилизации кадра
    await new Promise(r => setTimeout(r, 300));
    
    // Запуск классификации (возвращает топ-10)
    const predictions = await classifier(video, { topk: 10 });
    
    console.log('Raw AI predictions:', predictions);
    
    // Показываем сырые результаты AI
    resultsEl.classList.add('show');
    resultsEl.innerHTML = '<div class="result-header">🧠 Что видит ViT (ImageNet)</div>';
    
    predictions.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'pred' + (i === 0 ? ' top' : '');
      div.innerHTML = `
        <div class="pred-icon">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)}</div>
        <div class="pred-info">
          <div class="pred-name">${p.label}</div>
          <div class="pred-sub">ImageNet class · ${i === 0 ? 'TOP MATCH' : 'альтернатива'}</div>
        </div>
        <div class="pred-conf">${(p.score * 100).toFixed(1)}%</div>
      `;
      resultsEl.appendChild(div);
    });
    
    // Сопоставляем с базой авто
    const matches = matchWithDatabase(predictions);
    
    if (matches.length > 0) {
      const best = matches[0];
      const topLabel = best.matchedLabels[0];
      matchEl.classList.add('show');
      matchEl.innerHTML = `
        <b>🚗 ${best.car.make} ${best.car.model}</b>
        <small>Найдено совпадений в базе: <b style="color:var(--good)">${best.matchedLabels.length}</b></small>
        <div class="reasons">
          <b style="color:var(--c)">Ключевые совпадения:</b><br>
          ${best.matchedLabels.slice(0, 3).map(m => 
            `• "${m.label}" (${(m.score*100).toFixed(1)}%)`
          ).join('<br>')}
        </div>
      `;
      setStatus(`✓ ${best.car.make} ${best.car.model}`, 'success');
    } else {
      matchEl.classList.add('show');
      matchEl.innerHTML = `
        <b>⚠ Не найдено в базе</b>
        <small>AI видит: <b style="color:var(--c)">${predictions[0].label}</b>, но этой модели нет в нашей базе данных.<br><br>
        ViT классифицирует объекты по ImageNet — там ~100 классов авто. Попробуйте:</small>
        <div class="reasons">
          • Porsche 911, Ferrari, Lamborghini<br>
          • BMW, Mercedes, Audi<br>
          • Mustang, Corvette, Challenger<br>
          • Tesla, Land Cruiser, Range Rover
        </div>
      `;
      setStatus('Авто не найдено в базе', 'ready');
    }
    
  } catch (e) {
    setStatus('✗ Ошибка: ' + e.message, 'error');
    console.error('Scan error:', e);
  } finally {
    btnScan.disabled = false;
  }
});

// Запуск при загрузке
loadModel();
</script>
</body>
</html>
