<!DOCTYPE html>
<html lang="ru" data-theme="vice">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>WAINK — AR-сканер автомобилей · Vice City Edition</title>
<meta name="description" content="Наведи камеру на автомобиль — WAINK покажет марку, модель, годы выпуска и рыночную цену. AR-интерфейс в духе GTA VI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ THEME SYSTEM ============ */
:root{
  --bg0:#07030f; --bg1:#120826; --bg2:#1a0d33;
  --surface:rgba(22,11,44,.78); --surface2:rgba(30,15,58,.92);
  --ink:#f4eeff; --muted:#9d8fc0; --line:rgba(190,140,255,.18);
  --good:#3ef08c; --warn:#ffb020; --bad:#ff3b5c; --info:#38bdf8; --gold:#ffd60a;
  --grad:linear-gradient(100deg,var(--a),var(--b));
  --grad3:linear-gradient(115deg,var(--a),var(--b) 45%,var(--c));
  --disp:'Unbounded',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
[data-theme="vice"]{ --a:#ff2e88; --b:#ff7a18; --c:#00e5ff; --d:#8b3dff; }
[data-theme="ocean"]{ --a:#19c8ff; --b:#5b6cff; --c:#ff4bd8; --d:#12e6b0; }
[data-theme="acid"]{ --a:#b6ff2e; --b:#ffd60a; --c:#ff2ea6; --d:#8b3dff; }

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg0); color:var(--ink); font-family:var(--body);
  overflow:hidden; -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:6px}
::selection{background:var(--a);color:#14061f}

/* custom scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--a) rgba(24,12,46,.6)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(123,47,247,.10);border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--a),var(--b));border-radius:8px;border:2px solid rgba(10,5,22,.9)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--c),var(--a))}

/* ============ WORLD BACKGROUND ============ */
.world{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 110%, #241040 0%, var(--bg0) 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;mix-blend-mode:screen}
.blob.b1{width:56vw;height:56vw;left:-14vw;top:-18vw;background:radial-gradient(circle,var(--a),transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
.blob.b2{width:48vw;height:48vw;right:-12vw;top:8vh;background:radial-gradient(circle,var(--d),transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
.blob.b3{width:44vw;height:44vw;left:24vw;bottom:-20vw;background:radial-gradient(circle,var(--c),transparent 65%);opacity:.28;animation:drift1 38s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(9vw,7vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-8vw,10vh) scale(.9)}}
.bg-grid{position:absolute;left:-25%;right:-25%;bottom:-14%;height:58%;
  background:repeating-linear-gradient(90deg, rgba(255,46,136,.16) 0 1px, transparent 1px 90px),
  repeating-linear-gradient(0deg, rgba(0,229,255,.13) 0 1px, transparent 1px 64px);
  transform:perspective(620px) rotateX(63deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%);
  animation:gridflow 9s linear infinite}
@keyframes gridflow{to{background-position:0 0,0 64px}}
.grain{position:fixed;inset:-40px;z-index:220;pointer-events:none;opacity:.055;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="160" height="160" filter="url(%23n)" opacity="0.6"/></svg>');
  animation:grain .9s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(-14px,9px)}100%{transform:translate(11px,-13px)}}

/* ============ STAGE LAYOUT ============ */
.stage{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;gap:clamp(28px,5vw,84px);padding:20px}
.intel{width:min(430px,36vw);display:none;flex-direction:column;gap:22px;max-height:92vh}
@media(min-width:1080px){.intel{display:flex}}
.intel .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--c);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.intel .eyebrow::before{content:"";width:34px;height:1px;background:var(--grad)}
.intel h1{font-family:var(--disp);font-weight:900;font-size:clamp(48px,5.4vw,76px);line-height:.95;
  background:var(--grad3);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,46,136,.35))}
.intel .sub{font-size:17px;color:var(--muted);line-height:1.55;max-width:40ch}
.intel .sub b{color:var(--ink)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.step i{font-style:normal;font-family:var(--disp);font-weight:700;font-size:15px;width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;color:#14061f;background:var(--grad)}
.step:nth-child(2) i{background:linear-gradient(120deg,var(--c),var(--d))}
.step:nth-child(3) i{background:linear-gradient(120deg,var(--gold),var(--b))}
.step p{font-size:13.5px;color:var(--muted)} .step p b{color:var(--ink);display:block;font-size:14px}
.istats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.istat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.istat b{font-family:var(--mono);font-size:20px;display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.istat.g b{background:linear-gradient(100deg,var(--good),var(--c));-webkit-background-clip:text;background-clip:text}
.istat span{font-size:10px;font-family:var(--mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.keys{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.keys kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 7px;background:var(--bg1);color:var(--c)}
.ilog{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-height:96px}
.ilog h3{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--muted);margin-bottom:8px}
.ilog ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.ilog li{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;gap:8px;animation:logIn .4s ease both}
.ilog li b{color:var(--c);font-weight:400}
.ilog li:first-child{color:var(--ink)}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}}
.intel .fine{font-size:10.5px;color:var(--muted);opacity:.75;line-height:1.5}
.intel .cta{align-self:flex-start;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;padding:13px 22px;border-radius:14px;color:#14061f;background:var(--grad);box-shadow:0 8px 30px -6px var(--a);transition:.2s}
.intel .cta:hover{transform:translateY(-2px);box-shadow:0 14px 40px -6px var(--a)}

/* ============ DEVICE ============ */
.device{position:relative;height:min(92vh,880px);aspect-ratio:9/19.2;padding:10px;border-radius:52px;background:#05020a;border:1px solid rgba(190,140,255,.25);
  box-shadow:0 0 0 1px rgba(0,0,0,.8),0 30px 90px -20px rgba(139,61,255,.5),0 0 90px -20px rgba(255,46,136,.35),inset 0 0 24px rgba(139,61,255,.15)}
.device::before{content:"";position:absolute;right:-3px;top:150px;width:3px;height:88px;border-radius:3px;background:linear-gradient(var(--a),var(--d))}
.device::after{content:"";position:absolute;left:-3px;top:120px;width:3px;height:52px;border-radius:3px;background:linear-gradient(var(--c),var(--d))}
.notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:112px;height:26px;border-radius:16px;background:#05020a;z-index:96;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;border:1px solid rgba(190,140,255,.12)}
.notch::after{content:"";width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #3a2a6a, #0a0518);box-shadow:0 0 6px rgba(0,229,255,.5)}
.app{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg0);isolation:isolate}
@media(max-width:1079px){
  .stage{padding:0}
  .device{width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;padding:0;border-radius:0;border:0;box-shadow:none}
  .device::before,.device::after,.notch{display:none}
  .app{border-radius:0}
}

/* ============ APP LAYERS ============ */
#cam,#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#cam{display:none}
.app.cam-on #cam{display:block}
.app.cam-on #scene{display:none}
#cam.mirror{transform:scaleX(-1)}
.cam-tint{position:absolute;inset:0;z-index:2;pointer-events:none;display:none;background:linear-gradient(160deg,rgba(255,46,136,.07),rgba(139,61,255,.05) 50%,rgba(0,229,255,.07))}
.app.cam-on .cam-tint{display:block}
.hud-grid{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.5;background:
  repeating-linear-gradient(90deg, rgba(190,140,255,.07) 0 1px, transparent 1px 64px),
  repeating-linear-gradient(0deg, rgba(190,140,255,.07) 0 1px, transparent 1px 64px),
  linear-gradient(90deg, transparent calc(50% - .5px), rgba(0,229,255,.14) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
  linear-gradient(0deg, transparent calc(50% - .5px), rgba(0,229,255,.14) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px))}
.app.no-grid .hud-grid{display:none}
.vignette{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(5,2,12,.55) 100%)}
.scanlines{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.5;background:repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px)}
.corner{position:absolute;width:26px;height:26px;z-index:6;pointer-events:none;filter:drop-shadow(0 0 6px currentColor)}
.c-tl{top:calc(112px + var(--sat));left:14px;border-top:2px solid var(--a);border-left:2px solid var(--a);color:var(--a)}
.c-tr{top:calc(112px + var(--sat));right:14px;border-top:2px solid var(--b);border-right:2px solid var(--b);color:var(--b)}
.c-bl{bottom:calc(122px + var(--sab));left:14px;border-bottom:2px solid var(--c);border-left:2px solid var(--c);color:var(--c)}
.c-br{bottom:calc(122px + var(--sab));right:14px;border-bottom:2px solid var(--d);border-right:2px solid var(--d);color:var(--d)}
.app[data-phase="scan"] .corner{animation:cornerPulse 1s ease-in-out infinite}
@keyframes cornerPulse{50%{transform:scale(1.25);filter:drop-shadow(0 0 12px currentColor)}}

/* Shutter effect for live build */
.shutter{position:absolute;inset:0;z-index:98;background:var(--ink);opacity:0;pointer-events:none;transform:scaleY(0);transform-origin:top}
.shutter.flash{animation:shutterFlash .25s ease-out forwards}
@keyframes shutterFlash{0%{opacity:.8;transform:scaleY(0)}50%{opacity:.8;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}

/* topbar */
.topbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(12px + var(--sat)) 14px 10px;background:linear-gradient(rgba(5,2,12,.85),rgba(5,2,12,.35) 80%,transparent);
  transform:translateY(-110%);transition:transform .6s cubic-bezier(.2,.9,.3,1) .1s}
.app.booted .topbar{transform:none}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-family:var(--disp);font-weight:900;font-size:19px;letter-spacing:.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,46,136,.5))}
.logo span{font-family:var(--mono);font-size:7.5px;letter-spacing:.3em;color:var(--muted);margin-top:3px}
.money-wrap{margin-left:auto;position:relative;font-family:var(--mono);font-weight:700;font-size:14px;color:var(--good);text-shadow:0 0 12px rgba(62,240,140,.6)}
.float-money{position:absolute;right:0;top:-4px;font-size:11px;color:var(--gold);animation:floatUp 1.3s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes floatUp{to{transform:translateY(-22px);opacity:0}}
.tbtn{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:.2s}
.tbtn:hover{border-color:var(--a);box-shadow:0 0 14px -2px var(--a)}
.tbtn:active{transform:scale(.9)}
.tbtn.off{color:var(--muted)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* status line */
.statusline{position:absolute;top:calc(58px + var(--sat));left:14px;right:14px;z-index:29;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);opacity:0;transition:opacity .6s .35s}
.app.booted .statusline{opacity:1}
.mode-chip{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--c);font-weight:700;letter-spacing:.14em;transition:.2s}
.mode-chip:hover{border-color:var(--c)}
.mode-chip .dot{width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.app.cam-on .mode-chip{color:var(--bad)}
.app.cam-on .mode-chip .dot{background:var(--bad);box-shadow:0 0 8px var(--bad);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.statusline .clock{color:var(--ink);font-weight:700}
.statusline .gps{margin-left:auto}
.statusline .net{color:var(--good);font-weight:700}

/* compass */
.compass{position:absolute;top:calc(84px + var(--sat));left:50%;transform:translateX(-50%);width:210px;height:20px;z-index:28;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 25% 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25% 75%,transparent);opacity:0;transition:opacity .6s .5s}
.app.booted .compass{opacity:.9}
.compass-track{display:flex;white-space:nowrap;font-family:var(--mono);font-size:9px;color:var(--muted);will-change:transform}
.compass-track span{width:48px;flex:none;text-align:center;letter-spacing:.1em}
.compass-track span.card-dir{color:var(--c);font-weight:700}
.compass::after{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;background:var(--a);box-shadow:0 0 8px var(--a);transform:translateX(-50%)}
.app.no-tele .compass,.app.no-tele .tele,.app.no-tele #radar{display:none}

/* telemetry */
.tele{position:absolute;z-index:28;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--muted);pointer-events:none;opacity:0;transition:opacity .6s .6s}
.app.booted .tele{opacity:1}
.tele-l{left:14px;top:calc(150px + var(--sat));display:flex;flex-direction:column;gap:7px}
.tele-l b{color:var(--c);font-weight:400}
.tele-r{right:16px;top:calc(160px + var(--sat));width:12px;height:150px;
  background:repeating-linear-gradient(0deg, rgba(190,140,255,.4) 0 1px, transparent 1px 12px)}
.tele-r i{position:absolute;left:-4px;top:var(--ry,40%);width:20px;height:2px;background:var(--b);box-shadow:0 0 8px var(--b);transition:top .5s ease}
#radar{position:absolute;left:14px;bottom:calc(138px + var(--sab));width:78px;height:78px;z-index:28;pointer-events:none;opacity:0;transition:opacity .6s .7s}
.app.booted #radar{opacity:1}

/* detection box */
.box{position:absolute;z-index:12;pointer-events:none;opacity:0;transition:opacity .3s;will-change:transform,width,height}
.app[data-phase="scan"] .box,.app[data-phase="result"]:not(.archive) .box{opacity:1}
.box i{position:absolute;width:18px;height:18px;border:2px solid var(--c);filter:drop-shadow(0 0 6px var(--c));transition:border-color .3s}
.box i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.box i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.box i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.box i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.box.locked i{border-color:var(--good);filter:drop-shadow(0 0 8px var(--good))}
.box::before{content:"";position:absolute;inset:0;background:rgba(0,229,255,.05);transition:background .3s}
.box.locked::before{background:rgba(62,240,140,.06)}
.box-label{position:absolute;top:-26px;left:0;font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:4px 9px;border-radius:6px;background:var(--surface2);border:1px solid var(--c);color:var(--c);white-space:nowrap}
.box.locked .box-label{border-color:var(--good);color:var(--good)}
.box-scan{position:absolute;left:2px;right:2px;height:2px;background:var(--grad);box-shadow:0 0 12px var(--a);opacity:0}
.app[data-phase="scan"] .box-scan{opacity:1;animation:sweep 1.15s linear infinite}
@keyframes sweep{from{top:2px}to{top:calc(100% - 4px)}}
.cands{position:absolute;top:-26px;right:0;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.cand{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);transition:.25s}
.cand.win{border-color:var(--a);color:var(--ink);box-shadow:0 0 12px -3px var(--a)}
.cand.fade{opacity:0}

/* connector */
.link{position:absolute;inset:0;z-index:11;pointer-events:none;width:100%;height:100%;opacity:0;transition:opacity .4s}
.app[data-phase="result"]:not(.archive) .link{opacity:1}
.link path{fill:none;stroke:url(#lg);stroke-width:1.6;stroke-dasharray:5 6;animation:dashflow 1.2s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-22}}
.link circle{fill:var(--a);filter:drop-shadow(0 0 5px var(--a))}
#fx{position:absolute;inset:0;z-index:14;pointer-events:none;width:100%;height:100%}

/* hint */
.hint{position:absolute;left:16px;right:16px;bottom:calc(126px + var(--sab));z-index:26;display:flex;justify-content:center;gap:12px;align-items:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 10px rgba(0,229,255,.5);
  opacity:0;transition:opacity .5s .8s;pointer-events:none;text-align:center}
.app.booted .hint{opacity:1}
.app[data-phase="result"] .hint{opacity:0!important;transition:opacity .2s}
.hint b{color:var(--c);font-weight:700}

/* deck */
.deck{position:absolute;left:14px;right:14px;bottom:calc(12px + var(--sab));z-index:50;display:flex;align-items:flex-end;justify-content:space-between;
  transform:translateY(140%);transition:transform .6s cubic-bezier(.2,.9,.3,1) .25s}
.app.booted .deck{transform:none}
.dbtn{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;transition:.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dbtn:hover{border-color:var(--c);box-shadow:0 0 16px -3px var(--c)}
.dbtn:active{transform:scale(.9)}
.dbtn.on{border-color:var(--a);color:var(--a);box-shadow:0 0 16px -4px var(--a)}
.dbtn .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--grad);color:#14061f;font-family:var(--mono);font-size:9.5px;font-weight:700;display:grid;place-items:center}
.dbtn .badge.pulse{animation:badgePulse .5s ease}
@keyframes badgePulse{50%{transform:scale(1.45)}}
#btnTorch{display:none}
#btnTorch.avail{display:grid}
.scan-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.scan-wrap{position:relative;width:92px;height:92px}
.scan-ring{position:absolute;inset:0;transform:rotate(-90deg)}
.scan-ring .base{stroke:rgba(190,140,255,.2)}
.scan-ring .prog{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .1s linear;filter:drop-shadow(0 0 5px var(--a))}
#btnScan{position:absolute;inset:10px;border-radius:50%;background:var(--grad);color:#14061f;display:grid;place-items:center;
  box-shadow:0 10px 34px -8px var(--a),inset 0 2px 6px rgba(255,255,255,.35);transition:transform .15s;animation:breathe 2.6s ease-in-out infinite}
#btnScan:hover{transform:scale(1.05)}
#btnScan:active{transform:scale(.93)}
@keyframes breathe{50%{box-shadow:0 10px 44px -4px var(--a),inset 0 2px 6px rgba(255,255,255,.35)}}
#btnScan .ic{width:30px;height:30px;stroke-width:2.1;position:absolute;transition:opacity .2s,transform .2s}
#btnScan .i-cancel,#btnScan .i-refresh{opacity:0;transform:scale(.5)}
.app[data-phase="scan"] #btnScan .i-scan{opacity:0;transform:scale(.5)}
.app[data-phase="scan"] #btnScan .i-cancel{opacity:1;transform:none}
.app[data-phase="scan"] #btnScan{animation:none}
.app[data-phase="result"] #btnScan .i-scan{opacity:0;transform:scale(.5)}
.app[data-phase="result"] #btnScan .i-refresh{opacity:1;transform:none}
.scan-label{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--ink);text-shadow:0 0 8px var(--a)}

/* ============ RESULT CARD ============ */
.card{position:absolute;left:10px;right:10px;bottom:calc(122px + var(--sab));z-index:45;max-height:min(58%,470px);overflow-y:auto;overscroll-behavior:contain;
  border-radius:22px;padding:16px 16px 14px;background:linear-gradient(165deg,rgba(30,14,58,.94),rgba(9,4,20,.96));
  border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 70px -18px rgba(0,0,0,.9),0 0 50px -18px var(--a);
  transform:translateY(115%);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.25,1.12),opacity .3s;pointer-events:none}
.card::before{content:"";position:absolute;top:0;left:16px;right:16px;height:2px;background:var(--grad3);border-radius:2px}
.card.open{transform:none;opacity:1;pointer-events:auto}
.card>*{opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .4s ease}
.card.open>*{opacity:1;transform:none}
.card.open>*:nth-child(2){transition-delay:.06s}.card.open>*:nth-child(3){transition-delay:.12s}
.card.open>*:nth-child(4){transition-delay:.18s}.card.open>*:nth-child(5){transition-delay:.24s}
.card.open>*:nth-child(6){transition-delay:.3s}.card.open>*:nth-child(7){transition-delay:.36s}.card.open>*:nth-child(8){transition-delay:.4s}
.card-top{display:flex;align-items:flex-start;gap:12px}
.badge{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:20px;color:var(--ink);
  background:var(--bg1);border:2px solid var(--cc,var(--a));box-shadow:0 0 16px -3px var(--cc,var(--a)),inset 0 0 12px rgba(0,0,0,.6)}
.card-title{flex:1;min-width:0}
.card-title .make{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
.card-title .model{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.rarity{display:flex;gap:2px;margin-top:5px}
.rarity .ic{width:12px;height:12px;color:rgba(190,140,255,.25)}
.rarity .ic.lit{color:var(--gold);fill:var(--gold);filter:drop-shadow(0 0 4px var(--gold))}
.xbtn{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);color:var(--muted);transition:.2s}
.xbtn:hover{color:var(--bad);border-color:var(--bad)}
.xbtn .ic{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.chip .cdot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor}
.chip.conf{border-color:var(--good);color:var(--good)}
.chip.cls{border-color:var(--clsc,var(--c));color:var(--clsc,var(--c))}
.block{margin-top:13px;padding:12px 14px;border-radius:16px;background:rgba(10,5,22,.55);border:1px solid var(--line)}
.block .blabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.years-val{font-family:var(--mono);font-weight:700;font-size:24px;margin-top:5px;color:var(--ink);text-shadow:0 0 14px rgba(0,229,255,.4)}
.years-val em{font-style:normal;color:var(--c)}
.gen{font-size:11px;color:var(--muted);margin-top:2px}
.price-val{font-family:var(--disp);font-weight:900;font-size:32px;margin-top:5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,122,24,.35))}
.price-rub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.range{margin-top:11px}
.range-track{position:relative;height:6px;border-radius:4px;background:rgba(190,140,255,.14)}
.range-fill{position:absolute;inset:0;border-radius:4px;background:linear-gradient(90deg,var(--c),var(--a),var(--b));opacity:.85}
.range-mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--a);transform:translate(-50%,-50%);box-shadow:0 0 12px var(--a);left:0;transition:left 1s cubic-bezier(.2,.9,.3,1)}
.range-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:6px}
.specs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:13px}
.spec{padding:9px 10px;border-radius:12px;background:rgba(10,5,22,.55);border:1px solid var(--line)}
.spec span{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;color:var(--muted)}
.spec b{display:block;font-size:12.5px;font-weight:800;margin-top:3px;color:var(--ink)}
.note-area{width:100%;margin-top:8px;min-height:52px;resize:vertical;background:rgba(10,5,22,.6);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12.5px;color:var(--ink);line-height:1.4}
.note-area:focus{border-color:var(--c);outline:none}
.saved-line{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:10px;letter-spacing:.1em}
.card-actions{display:flex;gap:8px;margin-top:14px}
.abtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 8px;border-radius:13px;font-weight:800;font-size:12px;letter-spacing:.04em;border:1px solid var(--line);color:var(--ink);transition:.2s;background:rgba(190,140,255,.06)}
.abtn:hover{border-color:var(--c);box-shadow:0 0 14px -4px var(--c)}
.abtn:active{transform:scale(.96)}
.abtn .ic{width:15px;height:15px}
.abtn.primary{background:var(--grad);color:#14061f;border:0;box-shadow:0 8px 24px -8px var(--a)}
.abtn.primary:hover{box-shadow:0 10px 30px -6px var(--a)}
.abtn.primary:disabled{background:rgba(62,240,140,.15);color:var(--good);box-shadow:none;cursor:default;border:1px solid rgba(62,240,140,.4)}
.abtn.danger:hover{border-color:var(--bad);color:var(--bad);box-shadow:0 0 14px -4px var(--bad)}

/* ============ SHEETS ============ */
.scrim{position:absolute;inset:0;z-index:55;background:rgba(5,2,12,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;border-radius:26px 26px 0 0;
  background:linear-gradient(170deg,var(--bg2),var(--bg0) 70%);border:1px solid var(--line);border-bottom:0;
  box-shadow:0 -20px 70px -20px rgba(139,61,255,.5);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1);overflow:hidden}
.sheet.open{transform:none}
.sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:4px;border-radius:3px;background:var(--grad);opacity:.8}
.garage{height:87%}
.settings{max-height:80%}
.sheet-head{display:flex;align-items:center;gap:10px;padding:22px 16px 10px}
.sheet-head h2{font-family:var(--disp);font-weight:700;font-size:17px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.count-chip{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:12px;background:rgba(0,229,255,.12);color:var(--c);border:1px solid rgba(0,229,255,.3)}
.sheet-head .sp{flex:1}
.gtotal{font-family:var(--mono);font-size:11px;color:var(--good);padding:0 16px 8px;letter-spacing:.06em}
.gtools{display:flex;gap:8px;padding:0 16px 10px}
.search-wrap{flex:1;display:flex;align-items:center;gap:8px;background:rgba(10,5,22,.7);border:1px solid var(--line);border-radius:12px;padding:0 11px}
.search-wrap .ic{width:14px;height:14px;color:var(--muted);flex:none}
.search-wrap input{flex:1;min-width:0;background:none;border:0;padding:10px 0;font-size:13px;color:var(--ink)}
.search-wrap input:focus{outline:none}
.search-wrap input::placeholder{color:var(--muted)}
.sel-wrap{position:relative}
.sel-wrap select{appearance:none;-webkit-appearance:none;background:rgba(10,5,22,.7);border:1px solid var(--line);border-radius:12px;padding:10px 30px 10px 12px;font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer}
.sel-wrap::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--c);border-bottom:1.6px solid var(--c);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.gchips{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.vchip{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);transition:.2s}
.vchip:hover{color:var(--ink)}
.vchip.on{background:var(--grad);color:#14061f;border-color:transparent;font-weight:700;box-shadow:0 4px 14px -4px var(--a)}
.gstats{padding:0 16px 10px}
.gbar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:rgba(190,140,255,.1)}
.gbar i{display:block;height:100%;transition:width .5s ease}
.glegend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:7px}
.glegend span{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:8.5px;color:var(--muted);letter-spacing:.05em}
.glegend i{width:7px;height:7px;border-radius:2px}
.bulkbar{display:none;align-items:center;gap:8px;padding:0 16px 10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.garage.bulk .bulkbar{display:flex}
.garage.bulk .gtools,.garage.bulk .gchips{display:none}
.bulkbar .abtn{flex:none;padding:8px 14px;font-size:11px}
.glist{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 12px calc(16px + var(--sab))}
.grow{display:flex;align-items:center;gap:11px;padding:11px 8px;border-radius:16px;border:1px solid transparent;cursor:pointer;transition:.18s;animation:rowIn .35s ease both}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}
.grow:hover{background:rgba(190,140,255,.06);border-color:var(--line)}
.gcheck{display:none;flex:none}
.garage.bulk .gcheck{display:block}
.gcheck input{width:17px;height:17px;accent-color:var(--a);cursor:pointer}
.gbadge{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:16px;background:var(--bg1);border:2px solid var(--cc,var(--a));box-shadow:0 0 10px -3px var(--cc,var(--a))}
.ginfo{flex:1;min-width:0}
.ginfo b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ginfo span{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.ginfo i{display:block;font-style:italic;font-size:10.5px;color:var(--c);opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gside{text-align:right;flex:none}
.gprice{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink)}
.gacts{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.gicon{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--muted);transition:.15s}
.gicon .ic{width:14px;height:14px}
.gicon:hover{color:var(--ink);background:rgba(190,140,255,.1)}
.gicon.fav.on{color:var(--gold)} .gicon.fav.on .ic{fill:var(--gold);filter:drop-shadow(0 0 4px var(--gold))}
.gicon.del:hover{color:var(--bad)}
.gempty{padding:38px 20px;text-align:center;color:var(--muted)}
.gempty svg{width:110px;height:60px;margin:0 auto 14px;display:block;stroke:var(--d);opacity:.7}
.gempty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.gempty p{font-size:12px;line-height:1.5}

/* settings */
.set-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(18px + var(--sab))}
.set-group{margin-top:12px}
.set-group h3{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--c);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.set-group h3::after{content:"";flex:1;height:1px;background:var(--line)}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 2px;font-size:13.5px;font-weight:700}
.set-row small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:2px}
.set-row .grow-l{flex:1}
.switch{position:relative;flex:none;width:44px;height:25px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0}
.switch .track{position:absolute;inset:0;border-radius:14px;background:rgba(190,140,255,.15);border:1px solid var(--line);transition:.25s}
.switch .knob{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--muted);transition:.25s cubic-bezier(.2,.9,.3,1.3)}
.switch input:checked~.track{background:var(--grad);border-color:transparent;box-shadow:0 0 12px -3px var(--a)}
.switch input:checked~.track .knob{left:22px;background:#14061f}
.swatches{display:flex;gap:10px;padding:4px 2px 8px}
.swatch{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);transition:.2s;font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--muted)}
.swatch i{width:30px;height:30px;border-radius:50%;box-shadow:0 4px 14px -3px rgba(0,0,0,.6)}
.swatch[data-set-theme="vice"] i{background:linear-gradient(120deg,#ff2e88,#ff7a18)}
.swatch[data-set-theme="ocean"] i{background:linear-gradient(120deg,#19c8ff,#5b6cff)}
.swatch[data-set-theme="acid"] i{background:linear-gradient(120deg,#b6ff2e,#ffd60a)}
.swatch.on{border-color:var(--a);color:var(--ink);box-shadow:0 0 14px -5px var(--a)}
input[type="range"]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--b));outline:none;cursor:pointer}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--a);box-shadow:0 0 10px var(--a);cursor:grab}
input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--a);box-shadow:0 0 10px var(--a);cursor:grab}
.speed-val{font-family:var(--mono);font-size:11px;color:var(--c);width:44px;text-align:right;flex:none}
.set-row .sel-wrap select{width:100%;max-width:190px}
.wipe{width:100%;margin-top:6px;padding:12px;border-radius:13px;border:1px solid rgba(255,59,92,.4);color:var(--bad);font-weight:800;font-size:12.5px;transition:.2s}
.wipe:hover{background:rgba(255,59,92,.12)}
.wipe.arm{background:var(--bad);color:#14061f;animation:blink 0.6s steps(2) infinite}
.set-ver{text-align:center;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.2em;margin-top:14px;opacity:.7}

/* toasts */
.toasts{position:absolute;top:calc(112px + var(--sat));left:12px;right:12px;z-index:80;display:flex;flex-direction
