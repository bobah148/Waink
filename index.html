<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAINK · Smart Scanner v5.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --a: #ff2e88; --b: #ff7a18; --c: #00e5ff;
  --bg: #07030f; --ink: #f4eeff; --muted: #9d8fc0;
  --line: rgba(190,140,255,0.18); --good: #3ef08c; --bad: #ff3b5c;
  --grad: linear-gradient(100deg, var(--a), var(--b));
}
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 16px; }
h1 { font-size: 28px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 900; text-align: center; }
.status { font-family: monospace; font-size: 12px; color: var(--c); padding: 10px 16px; background: rgba(0,229,255,0.08); border: 1px solid var(--line); border-radius: 10px; max-width: 90%; text-align: center; min-height: 40px; display: flex; align-items: center; justify-content: center; }
.status.err { color: var(--bad); border-color: rgba(255,59,92,0.3); background: rgba(255,59,92,0.08); }
.status.ok { color: var(--good); border-color: rgba(62,240,140,0.3); background: rgba(62,240,140,0.08); }
video { width: min(90vw, 480px); aspect-ratio: 4/3; object-fit: cover; border-radius: 16px; border: 2px solid var(--line); background: #000; }
video.hidden { display: none; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button { font-family: inherit; padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid var(--line); color: var(--ink); background: rgba(190,140,255,0.06); transition: 0.2s; }
button:hover:not(:disabled) { border-color: var(--c); box-shadow: 0 0 14px -4px var(--c); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: var(--grad); color: #14061f; border: 0; }
button.primary:hover:not(:disabled) { box-shadow: 0 10px 30px -6px var(--a); }
.analysis { width: min(90vw, 480px); background: rgba(22,11,44,0.78); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: none; font-size: 12px; }
.analysis.show { display: block; }
.analysis h3 { font-size: 11px; color: var(--c); font-family: monospace; letter-spacing: 0.2em; margin-bottom: 10px; text-transform: uppercase; }
.analysis-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
.analysis-row:last-child { border: 0; }
.analysis-row span:first-child { color: var(--muted); }
.analysis-row span:last-child { font-family: monospace; color: var(--ink); font-weight: 700; }
.color-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: middle; margin-right: 6px; border: 1px solid rgba(255,255,255,0.2); }
.candidates { width: min(90vw, 480px); display: none; flex-direction: column; gap: 8px; }
.candidates.show { display: flex; }
.candidates h3 { font-size: 11px; color: var(--c); font-family: monospace; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 4px; }
.cand { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(22,11,44,0.78); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: 0.2s; }
.cand:hover { border-color: var(--c); background: rgba(190,140,255,0.08); transform: translateX(4px); }
.cand.selected { border-color: var(--good); background: rgba(62,240,140,0.08); }
.cand-badge { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-size: 18px; color: var(--ink); flex: none; }
.cand-info { flex: 1; min-width: 0; }
.cand-info b { display: block; font-size: 14px; color: var(--ink); }
.cand-info small { font-family: monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
.cand-conf { font-family: monospace; font-size: 12px; font-weight: 700; color: var(--good); }
.info { font-size: 11px; color: var(--muted); max-width: 480px; text-align: center; line-height: 1.5; }
.saved { padding: 14px; background: rgba(62,240,140,0.08); border: 1px solid rgba(62,240,140,0.3); border-radius: 12px; display: none; font-size: 13px; color: var(--good); text-align: center; width: min(90vw, 480px); }
.saved.show { display: block; }
</style>
</head>
<body>

<h1>WAINK · Smart Scanner</h1>
<div class="status" id="status">Нажмите "Включить камеру"</div>
<video id="video" playsinline muted autoplay class="hidden"></video>
<div class="controls">
  <button id="btnCam" class="primary">📷 Включить камеру</button>
  <button id="btnScan" disabled>🔍 Сканировать</button>
</div>
<div class="analysis" id="analysis"></div>
<div class="candidates" id="candidates"></div>
<div class="saved" id="saved"></div>
<div class="info">
  Умный анализ: определяет <b>цвет кузова</b> и <b>пропорции</b> автомобиля в реальном времени, затем находит подходящие модели в базе. Вы выбираете правильный вариант. Работает без интернета и тяжёлых загрузок.
</div>

<script>
const statusEl = document.getElementById('status');
const video = document.getElementById('video');
const btnCam = document.getElementById('btnCam');
const btnScan = document.getElementById('btnScan');
const analysisEl = document.getElementById('analysis');
const candidatesEl = document.getElementById('candidates');
const savedEl = document.getElementById('saved');

const DB = [
  {id:'camry', make:'Toyota', model:'Camry', type:'sedan', colors:['silver','black','red','blue','white']},
  {id:'corolla', make:'Toyota', model:'Corolla', type:'sedan', colors:['silver','black','white','blue','red']},
  {id:'civic', make:'Honda', model:'Civic', type:'sedan', colors:['blue','silver','black','white']},
  {id:'m4', make:'BMW', model:'M4', type:'sport', colors:['green','yellow','black','silver','blue']},
  {id:'eclas', make:'Mercedes-Benz', model:'E-Class', type:'luxury', colors:['black','silver','blue','gray']},
  {id:'911', make:'Porsche', model:'911 Carrera', type:'sport', colors:['yellow','red','silver','black']},
  {id:'mustang', make:'Ford', model:'Mustang GT', type:'muscle', colors:['red','orange','black','blue','white']},
  {id:'gtr', make:'Nissan', model:'GT-R', type:'sport', colors:['red','silver','black','white','blue']},
  {id:'corvette', make:'Chevrolet', model:'Corvette C8', type:'super', colors:['red','yellow','silver','black']},
  {id:'rs6', make:'Audi', model:'RS6 Avant', type:'luxury', colors:['green','gray','black','silver']},
  {id:'huracan', make:'Lamborghini', model:'Huracán', type:'super', colors:['green','orange','yellow','black','silver']},
  {id:'model3', make:'Tesla', model:'Model 3', type:'sedan', colors:['silver','black','red','blue']},
  {id:'lc300', make:'Toyota', model:'Land Cruiser 300', type:'suv', colors:['black','white','gray','green']},
  {id:'golf', make:'Volkswagen', model:'Golf GTI', type:'hatch', colors:['silver','red','black','blue']},
  {id:'wrx', make:'Subaru', model:'WRX', type:'sport', colors:['blue','silver','black','red']},
  {id:'challenger', make:'Dodge', model:'Challenger R/T', type:'muscle', colors:['purple','orange','black','green']},
  {id:'rangerover', make:'Land Rover', model:'Range Rover', type:'suv', colors:['black','green','silver','blue']},
  {id:'solaris', make:'Hyundai', model:'Solaris', type:'sedan', colors:['silver','white','red','black']},
  {id:'k5', make:'Kia', model:'K5', type:'sedan', colors:['silver','black','red','blue']},
  {id:'f150', make:'Ford', model:'F-150', type:'truck', colors:['black','silver','red','blue','white']}
];

const COLOR_NAMES = {
  'red': 'Красный', 'orange': 'Оранжевый', 'yellow': 'Жёлтый',
  'green': 'Зелёный', 'blue': 'Синий', 'purple': 'Фиолетовый',
  'pink': 'Розовый', 'black': 'Чёрный', 'white': 'Белый',
  'gray': 'Серый', 'silver': 'Серебристый', 'brown': 'Коричневый'
};

const TYPE_NAMES = {
  'sedan': 'Седан', 'sport': 'Спорткар', 'luxury': 'Люкс',
  'muscle': 'Маслкар', 'super': 'Суперкар', 'suv': 'Внедорожник',
  'hatch': 'Хэтчбек', 'truck': 'Пикап'
};

let stream = null;

btnCam.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }
    });
    video.srcObject = stream;
    await video.play();
    video.classList.remove('hidden');
    btnScan.disabled = false;
    btnCam.disabled = true;
    statusEl.textContent = '📷 Камера активна. Наведите на авто и нажмите Сканировать.';
    statusEl.className = 'status ok';
  } catch (e) {
    statusEl.textContent = '✗ Ошибка камеры: ' + (e.message || 'Доступ запрещён. Используйте HTTPS или localhost.');
    statusEl.className = 'status err';
  }
});

function analyzeFrame() {
  const canvas = document.createElement('canvas');
  const w = 160, h = 90;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  
  let rSum = 0, gSum = 0, bSum = 0, count = 0;
  let brightPixels = 0, darkPixels = 0;
  
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const brightness = (r + g + b) / 3;
    // Считаем только пиксели средней яркости (кузов авто), игнорируем фон и небо
    if (brightness > 40 && brightness < 220) {
      rSum += r; gSum += g; bSum += b; count++;
    }
    if (brightness > 200) brightPixels++;
    if (brightness < 50) darkPixels++;
  }
  
  if (count < 100) return null;
  
  const rAvg = rSum / count, gAvg = gSum / count, bAvg = bSum / count;
  const color = detectColor(rAvg, gAvg, bAvg);
  
  // Грубая оценка типа по распределению яркости (высокий авто = больше светлых пикселей сверху)
  let detectedType = null;
  if (brightPixels / (w * h) > 0.15 && darkPixels / (w * h) < 0.3) detectedType = 'suv';
  else if (darkPixels / (w * h) > 0.5) detectedType = 'sedan';
  
  return {
    color,
    colorHex: '#' + [rAvg, gAvg, bAvg].map(v => Math.round(v).toString(16).padStart(2, '0')).join(''),
    detectedType,
    sampleSize: count
  };
}

function detectColor(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const delta = max - min;
  const brightness = (r + g + b) / 3;
  if (delta < 25) {
    if (brightness > 200) return 'white';
    if (brightness > 140) return 'silver';
    if (brightness > 80) return 'gray';
    return 'black';
  }
  let hue;
  if (max === r) hue = ((g - b) / delta) % 6;
  else if (max === g) hue = (b - r) / delta + 2;
  else hue = (r - g) / delta + 4;
  hue = Math.round(hue * 60);
  if (hue < 0) hue += 360;
  if (hue < 15 || hue >= 345) return 'red';
  if (hue < 40) return 'orange';
  if (hue < 70) return 'yellow';
  if (hue < 160) return 'green';
  if (hue < 260) return 'blue';
  if (hue < 290) return 'purple';
  return 'pink';
}

function findCandidates(analysis) {
  const scored = DB.map(car => {
    let score = 0, reasons = [];
    if (car.colors.includes(analysis.color)) { score += 3; reasons.push('цвет совпадает'); }
    if (analysis.detectedType && car.type === analysis.detectedType) { score += 2; reasons.push('тип совпадает'); }
    if (['yellow','orange','green','purple'].includes(analysis.color) && (car.type === 'super' || car.type === 'sport')) {
      score += 1; reasons.push('яркий цвет → спорт');
    }
    return { car, score, reasons };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 3);
}

btnScan.addEventListener('click', () => {
  statusEl.textContent = '🔍 Анализируем кадр...';
  statusEl.className = 'status';
  candidatesEl.classList.remove('show');
  savedEl.classList.remove('show');
  
  setTimeout(() => {
    const analysis = analyzeFrame();
    if (!analysis) {
      statusEl.textContent = '✗ Не удалось проанализировать кадр. Наведите камеру ближе к авто.';
      statusEl.className = 'status err';
      return;
    }
    
    analysisEl.classList.add('show');
    analysisEl.innerHTML = `
      <h3>📊 Анализ кадра</h3>
      <div class="analysis-row"><span>Доминирующий цвет</span><span><span class="color-swatch" style="background:${analysis.colorHex}"></span>${COLOR_NAMES[analysis.color] || analysis.color}</span></div>
      <div class="analysis-row"><span>Определённый тип</span><span>${analysis.detectedType ? TYPE_NAMES[analysis.detectedType] : 'не определён'}</span></div>
      <div class="analysis-row"><span>Проанализировано пикселей</span><span>${analysis.sampleSize}</span></div>
    `;
    
    const candidates = findCandidates(analysis);
    candidatesEl.classList.add('show');
    candidatesEl.innerHTML = '<h3>🎯 Подходящие варианты (выберите)</h3>';
    
    candidates.forEach(c => {
      const conf = Math.min(95, 50 + c.score * 15);
      const div = document.createElement('div');
      div.className = 'cand';
      div.innerHTML = `
        <div class="cand-badge" style="background:${analysis.colorHex}">${c.car.make[0]}</div>
        <div class="cand-info"><b>${c.car.make} ${c.car.model}</b><small>${c.reasons.join(' · ')}</small></div>
        <div class="cand-conf">${conf}%</div>
      `;
      div.addEventListener('click', () => {
        document.querySelectorAll('.cand').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        selectCar(c.car, analysis);
      });
      candidatesEl.appendChild(div);
    });
    
    statusEl.textContent = '✓ Анализ завершён. Выберите подходящий вариант.';
    statusEl.className = 'status ok';
  }, 400);
});

function selectCar(car, analysis) {
  savedEl.classList.add('show');
  savedEl.innerHTML = `✓ Выбрано: <b>${car.make} ${car.model}</b><br><small style="color:var(--muted)">Цвет: ${COLOR_NAMES[analysis.color]} · Тип: ${TYPE_NAMES[car.type]}</small>`;
  statusEl.textContent = `🚗 Сохранено: ${car.make} ${car.model}`;
  console.log('Выбрано:', car, 'Анализ:', analysis);
}
</script>
</body>
</html>
